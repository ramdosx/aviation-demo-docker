name: Build and push aviation-demo image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Размер базы: 2y, 1y, 6m или 3m"
        required: true
        default: "2y"

env:
  IMAGE: ramdosx/aviation-demo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build \
            --build-arg DEMO_FILE=demo-20250901-${{ inputs.variant }}.sql.gz \
            -t $IMAGE:${{ inputs.variant }}-${{ matrix.arch }} .
          docker image ls
          df -h /

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 5432:5432 $IMAGE:${{ inputs.variant }}-${{ matrix.arch }}
          for i in $(seq 1 60); do
            docker exec smoke pg_isready -U postgres && break
            sleep 2
          done
          docker exec smoke psql -U postgres -d demo -c "SELECT bookings.version();" -c "SELECT count(*) AS flights FROM bookings.flights;" -c "SELECT * FROM bookings.airports LIMIT 3;"
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          username: ramdosx
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: docker push $IMAGE:${{ inputs.variant }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ramdosx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Multi-arch tag
        run: |
          V=${{ inputs.variant }}
          docker buildx imagetools create -t $IMAGE:$V $IMAGE:$V-amd64 $IMAGE:$V-arm64
          if [ "$V" = "2y" ]; then
            docker buildx imagetools create -t $IMAGE:latest $IMAGE:$V-amd64 $IMAGE:$V-arm64
          fi
